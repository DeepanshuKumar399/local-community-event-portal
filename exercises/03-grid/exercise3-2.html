<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3.2 – container, row, col-*</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h2>Container / Row / Col</h2>

  <!-- .container: fixed-width centered wrapper -->
  <div class="container border p-3 mb-3">
    <strong>.container</strong> – fixed max-width, centered
    <div class="row mt-2">
      <div class="col-4 bg-info p-2">.col-4</div>
      <div class="col-4 bg-warning p-2">.col-4</div>
      <div class="col-4 bg-danger text-white p-2">.col-4</div>
    </div>
  </div>

  <!-- .container-fluid: full-width -->
  <div class="container-fluid border p-3">
    <strong>.container-fluid</strong> – full width
    <div class="row mt-2">
      <div class="col-sm-6 bg-light p-2">.col-sm-6</div>
      <div class="col-sm-6 bg-secondary text-white p-2">.col-sm-6</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
