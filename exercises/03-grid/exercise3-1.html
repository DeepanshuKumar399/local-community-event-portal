<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3.1 – Responsive Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h2>Responsive Grid</h2>
  <!-- col-12 (mobile), col-md-6 (tablet 2/row), col-lg-4 (desktop 3/row) -->
  <div class="container">
    <div class="row g-3">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 bg-primary text-white rounded">Column 1</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 bg-secondary text-white rounded">Column 2</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 bg-success text-white rounded">Column 3</div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
