<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6.1 – Flexbox Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Stacks vertically on mobile, horizontal on md+ -->
  <nav class="d-flex flex-column flex-md-row align-items-md-center bg-dark p-3 gap-2">
    <a class="text-white fw-bold text-decoration-none me-md-auto" href="#">Brand</a>
    <a class="text-white text-decoration-none" href="#">Home</a>
    <a class="text-white text-decoration-none" href="#">About</a>
    <a class="text-white text-decoration-none" href="#">Contact</a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
