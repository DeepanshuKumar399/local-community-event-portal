<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 15.2 – Shadows & Rounded</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 d-flex gap-4 flex-wrap">
  <div class="card shadow p-3" style="width:180px">
    <p class="mb-0">shadow</p>
  </div>
  <div class="card shadow-lg p-3" style="width:180px">
    <p class="mb-0">shadow-lg</p>
  </div>
  <div class="card shadow-lg rounded-pill p-3 px-4" style="width:200px">
    <p class="mb-0">shadow-lg + rounded-pill</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
