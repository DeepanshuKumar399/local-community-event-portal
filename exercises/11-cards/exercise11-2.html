<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 11.2 – Media Object</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <!-- Bootstrap 5 uses flexbox utilities instead of a .media class -->
  <div class="d-flex gap-3 align-items-start">
    <img src="https://via.placeholder.com/80" class="rounded" alt="Media image">
    <div>
      <h5 class="mt-0">Media Heading</h5>
      <p class="mb-0">This is the media body content aligned to the right of the image using flexbox utilities.</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
