<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 13.2 – Gradient Backgrounds</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="p-4 mb-3 bg-dark bg-gradient text-white rounded">
    bg-dark + bg-gradient + text-white
  </div>
  <div class="p-4 mb-3 bg-primary bg-gradient text-white rounded">
    bg-primary + bg-gradient
  </div>
  <div class="p-4 bg-success bg-gradient text-white rounded">
    bg-success + bg-gradient
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
