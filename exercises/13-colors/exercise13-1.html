<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 13.1 – Colors Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h4 class="mb-3">Dashboard</h4>
  <div class="row g-3">
    <div class="col-sm-4"><div class="p-3 bg-primary text-white rounded">bg-primary</div></div>
    <div class="col-sm-4"><div class="p-3 bg-secondary text-white rounded">bg-secondary</div></div>
    <div class="col-sm-4"><div class="p-3 bg-success text-white rounded">bg-success</div></div>
    <div class="col-sm-4"><div class="p-3 bg-danger text-white rounded">bg-danger</div></div>
    <div class="col-sm-4"><div class="p-3 bg-warning rounded">bg-warning</div></div>
    <div class="col-sm-4"><div class="p-3 bg-info text-dark rounded">bg-info</div></div>
    <div class="col-sm-4"><div class="p-3 bg-light text-dark rounded border">bg-light</div></div>
    <div class="col-sm-4"><div class="p-3 bg-dark text-white rounded">bg-dark</div></div>
  </div>

  <div class="mt-4">
    <p class="text-primary">text-primary</p>
    <p class="text-success">text-success</p>
    <p class="text-danger">text-danger</p>
    <p class="text-warning">text-warning</p>
    <p class="text-muted">text-muted</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
