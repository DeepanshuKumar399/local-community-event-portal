<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4.2 – Four Equal Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <div class="row g-3">
      <div class="col-sm-3"><div class="bg-primary text-white p-3 rounded text-center">Col 1</div></div>
      <div class="col-sm-3"><div class="bg-success text-white p-3 rounded text-center">Col 2</div></div>
      <div class="col-sm-3"><div class="bg-warning p-3 rounded text-center">Col 3</div></div>
      <div class="col-sm-3"><div class="bg-danger text-white p-3 rounded text-center">Col 4</div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
