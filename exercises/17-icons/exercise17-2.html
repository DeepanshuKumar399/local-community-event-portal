<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 17.2 – Icon Buttons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h5>Icon-Only Buttons</h5>
  <div class="d-flex gap-2">
    <button class="btn btn-primary" title="Edit"><i class="bi bi-pencil"></i></button>
    <button class="btn btn-danger" title="Delete"><i class="bi bi-trash"></i></button>
    <button class="btn btn-success" title="Download"><i class="bi bi-download"></i></button>
    <button class="btn btn-secondary" title="Share"><i class="bi bi-share"></i></button>
    <button class="btn btn-outline-dark" title="Settings"><i class="bi bi-gear"></i></button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
