<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 5.2 – Column Reordering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h5>On mobile: A then B. On md+: B appears first.</h5>
  <div class="container">
    <div class="row g-3">
      <!-- On md+, this appears second -->
      <div class="col-12 col-md-6 order-md-2">
        <div class="bg-warning p-3 rounded text-center">A – order-md-2</div>
      </div>
      <!-- On md+, this appears first -->
      <div class="col-12 col-md-6 order-md-1">
        <div class="bg-info p-3 rounded text-center">B – order-md-1</div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
