<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 5.1 – Centering Content</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <!-- Horizontally centered columns -->
    <div class="row justify-content-center mb-4">
      <div class="col-4 bg-primary text-white p-3 text-center rounded">Centered Col</div>
    </div>

    <!-- Vertically + horizontally centered content -->
    <div class="row align-items-center justify-content-center bg-light border" style="height:150px">
      <div class="col-auto bg-success text-white p-3 rounded">Centered Vertically & Horizontally</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
