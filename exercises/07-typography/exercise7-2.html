<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 7.2 – Text Transform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <p class="text-uppercase">text-uppercase: hello world</p>
  <p class="text-lowercase">text-lowercase: HELLO WORLD</p>
  <p class="text-capitalize">text-capitalize: hello world</p>
  <p class="text-start">text-start (left aligned)</p>
  <p class="text-center">text-center (centered)</p>
  <p class="text-end">text-end (right aligned)</p>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
