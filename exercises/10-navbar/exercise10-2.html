<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 10.2 – Tabs & Pills</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h5>Nav Tabs</h5>
  <ul class="nav nav-tabs mb-3" id="myTab">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab1">Tab 1</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab2">Tab 2</button>
    </li>
  </ul>
  <div class="tab-content mb-4">
    <div class="tab-pane fade show active" id="tab1">Content for Tab 1</div>
    <div class="tab-pane fade" id="tab2">Content for Tab 2</div>
  </div>

  <h5>Nav Pills</h5>
  <ul class="nav nav-pills mb-3" id="myPills">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pill1">Pill 1</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pill2">Pill 2</button>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="pill1">Content for Pill 1</div>
    <div class="tab-pane fade" id="pill2">Content for Pill 2</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
