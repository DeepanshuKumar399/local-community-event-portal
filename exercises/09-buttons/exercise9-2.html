<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 9.2 – Button Groups & Toggles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h5>Button Group</h5>
  <div class="btn-group mb-4" role="group">
    <button class="btn btn-primary">Left</button>
    <button class="btn btn-primary">Middle</button>
    <button class="btn btn-primary">Right</button>
  </div>

  <h5>Toggle Buttons (Checkbox)</h5>
  <div class="btn-group" role="group">
    <input type="checkbox" class="btn-check" id="bold" autocomplete="off">
    <label class="btn btn-outline-secondary" for="bold">Bold</label>

    <input type="checkbox" class="btn-check" id="italic" autocomplete="off">
    <label class="btn btn-outline-secondary" for="italic">Italic</label>

    <input type="checkbox" class="btn-check" id="underline" autocomplete="off">
    <label class="btn btn-outline-secondary" for="underline">Underline</label>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
