<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 14.1 – Display Utilities</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="d-none d-md-block bg-primary text-white p-3 mb-2 rounded">
    Visible on md+ (hidden on mobile) — d-none d-md-block
  </div>

  <div class="d-none d-lg-flex bg-success text-white p-3 mb-2 rounded gap-3">
    <span>Flex item 1</span>
    <span>Flex item 2</span>
    <span>Visible on lg+ as flex — d-none d-lg-flex</span>
  </div>

  <div class="d-block d-md-none bg-warning p-3 rounded">
    Visible only on mobile — d-block d-md-none
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
